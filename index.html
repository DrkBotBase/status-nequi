<script>
    const API_URL = 'https://delivery.mjfood.top/nq/api/status';
    const CACHE_KEY = 'nequi_status_cache';
    const CACHE_DURATION = 10 * 60 * 1000;
    
    document.addEventListener('DOMContentLoaded', function() {
      const url = API_URL.split("//")[1] || API_URL;
      document.getElementById('api-domain').textContent = url;
    });
    
    function translateStatus(status) {
        const translations = {
            'Operational': 'Operacional',
            'Degraded Performance': 'Rendimiento degradado',
            'Partial Outage': 'Interrupción parcial',
            'Major Outage': 'Interrupción mayor',
            'Maintenance': 'Mantenimiento'
        };
        return translations[status] || status;
    }
    
    function translateGeneralStatus(status) {
        if (status === "All Systems Operational") {
            return "Todos los Sistemas funcionando";
        }
        return status;
    }
    
    function saveToCache(data) {
        const cacheData = {
            timestamp: Date.now(),
            data: data
        };
        localStorage.setItem(CACHE_KEY, JSON.stringify(cacheData));
    }
    
    function getFromCache() {
        const cached = localStorage.getItem(CACHE_KEY);
        if (!cached) return null;
        
        const cacheData = JSON.parse(cached);
        const now = Date.now();
        const age = now - cacheData.timestamp;
        
        if (age < CACHE_DURATION) {
            return cacheData.data;
        }
        
        return null;
    }
    
    function formatDate(dateString) {
        if (!dateString) return '--';
        try {
            const date = new Date(dateString);
            return date.toLocaleString('es-CO', {
                day: '2-digit',
                month: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        } catch(e) {
            return dateString;
        }
    }
    
    function getStatusColor(statusClass) {
        const colors = {
            operational: 'green',
            degraded: 'yellow',
            partial: 'orange',
            outage: 'red',
            maintenance: 'blue'
        };
        return colors[statusClass] || 'gray';
    }
    
    function getStatusBadge(status, statusClass) {
        const translatedStatus = translateStatus(status);
        const color = getStatusColor(statusClass);
        const bgColors = {
            green: 'bg-green-100 text-green-700',
            yellow: 'bg-yellow-100 text-yellow-700',
            orange: 'bg-orange-100 text-orange-700',
            red: 'bg-red-100 text-red-700',
            blue: 'bg-blue-100 text-blue-700',
            gray: 'bg-gray-100 text-gray-600'
        };
        return `<span class="px-2 py-1 rounded-full text-xs font-bold ${bgColors[color]}">${translatedStatus}</span>`;
    }

    function renderStatus(data) {
        const container = document.getElementById('contentContainer');
        const generalStatusSpan = document.getElementById('generalStatus');
        const statusIndicator = document.getElementById('statusIndicator');
        const lastUpdateText = document.getElementById('lastUpdateText');
        const cacheInfo = document.getElementById('cacheInfo');
        const globalStatusBadge = document.getElementById('globalStatusBadge');
        const totalServicesSpan = document.getElementById('totalServices');
        const operationalCountSpan = document.getElementById('operationalCount');
        const affectedCountSpan = document.getElementById('affectedCount');
        
        if (!data.success) {
            generalStatusSpan.textContent = 'Error al cargar datos';
            generalStatusSpan.classList.add('text-red-300');
            statusIndicator.className = 'w-3 h-3 bg-red-400 rounded-full';
            lastUpdateText.textContent = 'Error de conexión';
            globalStatusBadge.className = 'px-2 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700';
            globalStatusBadge.textContent = 'Error';
            container.innerHTML = `
                <div class="bg-white p-8 rounded-2xl text-center text-gray-400 shadow-sm">
                    <i class="fas fa-exclamation-triangle text-3xl mb-2 text-red-400"></i>
                    <p class="text-sm text-red-600">⚠️ No se pudieron cargar los datos</p>
                    <p class="text-xs text-gray-400 mt-2">${data.error || 'Error de conexión con la API'}</p>
                </div>
            `;
            return;
        }
        
        const translatedGeneralStatus = translateGeneralStatus(data.generalStatus);
        generalStatusSpan.textContent = translatedGeneralStatus;
        const isOperational = data.isAllOperational;
        generalStatusSpan.className = isOperational ? 'text-white text-2xl font-extrabold' : 'text-yellow-200 text-2xl font-extrabold';
        statusIndicator.className = `w-3 h-3 rounded-full ${isOperational ? 'bg-green-400' : 'bg-yellow-400'} animate-pulse-slow`;
        lastUpdateText.textContent = formatDate(data.lastUpdate);
        globalStatusBadge.className = `px-2 py-1 rounded-full text-xs font-bold ${isOperational ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`;
        globalStatusBadge.textContent = isOperational ? 'Todos OK' : 'Alerta';
        
        let totalServices = 0;
        let operationalCount = 0;
        
        if (data.groups) {
            data.groups.forEach(group => {
                if (group.children) {
                    group.children.forEach(child => {
                        totalServices++;
                        if (child.statusClass === 'operational') operationalCount++;
                    });
                }
            });
        }
        if (data.individualServices) {
            data.individualServices.forEach(service => {
                totalServices++;
                if (service.statusClass === 'operational') operationalCount++;
            });
        }
        
        totalServicesSpan.textContent = totalServices;
        operationalCountSpan.textContent = operationalCount;
        affectedCountSpan.textContent = totalServices - operationalCount;
        
        let html = '';
        
        if (data.individualServices && data.individualServices.length > 0) {
            html += `
                <div class="bg-white rounded-2xl shadow-sm border-l-4 border-gray-300 overflow-hidden fade-in">
                    <div class="p-4 bg-gray-50/50 border-b border-gray-100">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-cogs text-gray-500"></i>
                            <h3 class="font-bold text-gray-800">Servicios Individuales</h3>
                        </div>
                    </div>
                    <div class="divide-y divide-gray-100">
            `;
            
            data.individualServices.forEach(service => {
                const translatedServiceStatus = translateStatus(service.status);
                const serviceColor = getStatusColor(service.statusClass);
                const serviceIcon = getStatusIcon(service.statusClass);
                const iconColor = service.statusClass === 'operational' ? 'text-emerald-500' : 
                                service.statusClass === 'degraded' ? 'text-yellow-500' : 
                                service.statusClass === 'partial' ? 'text-orange-500' :
                                service.statusClass === 'outage' ? 'text-red-500' : 'text-blue-500';
                
                html += `
                    <div class="flex justify-between items-center p-3 hover:bg-gray-50 transition-colors">
                        <div class="flex items-center gap-2 min-w-0">
                            <!-- ESPACIO PARA ICONO DEL SERVICIO -->
                            ${serviceIcon ? `<img src="${serviceIcon}" class="w-4 h-4 ${iconColor}" alt="status">` : `<i class="fas ${service.statusClass === 'operational' ? 'fa-check-circle' : service.statusClass === 'degraded' ? 'fa-exclamation-triangle' : service.statusClass === 'partial' ? 'fa-chart-line' : service.statusClass === 'outage' ? 'fa-times-circle' : 'fa-tools'} ${iconColor} text-xs"></i>`}
                            <span class="text-sm text-gray-700 truncate">${escapeHtml(service.name)}</span>
                        </div>
                        <span class="text-xs font-medium ${service.statusClass === 'operational' ? 'text-emerald-600' : service.statusClass === 'degraded' ? 'text-yellow-600' : service.statusClass === 'partial' ? 'text-orange-600' : service.statusClass === 'outage' ? 'text-red-600' : 'text-blue-600'}">
                            ${translatedServiceStatus}
                        </span>
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
        }
        
        if (data.groups && data.groups.length > 0) {
            data.groups.forEach(group => {
                const color = getStatusColor(group.statusClass);
                const borderColor = color === 'green' ? 'border-indigo-500' : 
                                  color === 'yellow' ? 'border-yellow-500' :
                                  color === 'orange' ? 'border-orange-500' : 'border-red-500';
                
                let groupIcon = 'fa-boxes';
                if (group.name === 'Envía') groupIcon = 'fa-paper-plane';
                else if (group.name === 'Retiros') groupIcon = 'fa-money-bill-wave';
                else if (group.name === 'Recargas') groupIcon = 'fa-mobile-alt';
                
                html += `
                    <div class="bg-white rounded-2xl shadow-sm border-l-4 ${borderColor} overflow-hidden fade-in">
                        <div class="p-4 bg-gray-50/50 border-b border-gray-100">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <i class="fas ${groupIcon} text-indigo-500"></i>
                                    <h3 class="font-bold text-gray-800">${escapeHtml(group.name)}</h3>
                                </div>
                                ${getStatusBadge(group.status, group.statusClass)}
                            </div>
                        </div>
                        <div class="divide-y divide-gray-100">
                `;
                
                if (group.children && group.children.length > 0) {
                    group.children.forEach(child => {
                        const translatedChildStatus = translateStatus(child.status);
                        const childColor = getStatusColor(child.statusClass);
                        const childIcon = getStatusIcon(child.statusClass);
                        const iconColor = child.statusClass === 'operational' ? 'text-emerald-500' : 
                                        child.statusClass === 'degraded' ? 'text-yellow-500' : 
                                        child.statusClass === 'partial' ? 'text-orange-500' :
                                        child.statusClass === 'outage' ? 'text-red-500' : 'text-blue-500';
                        
                        html += `
                            <div class="flex justify-between items-center p-3 hover:bg-gray-50 transition-colors">
                                <div class="flex items-center gap-2 min-w-0">
                                    <!-- ESPACIO PARA ICONO DEL SERVICIO -->
                                    ${childIcon ? `<img src="${childIcon}" class="w-4 h-4 ${iconColor}" alt="status">` : `<i class="fas ${child.statusClass === 'operational' ? 'fa-check-circle' : child.statusClass === 'degraded' ? 'fa-exclamation-triangle' : child.statusClass === 'partial' ? 'fa-chart-line' : child.statusClass === 'outage' ? 'fa-times-circle' : 'fa-tools'} ${iconColor} text-xs"></i>`}
                                    <span class="text-sm text-gray-700 truncate">${escapeHtml(child.name)}</span>
                                </div>
                                <span class="text-xs font-medium ${child.statusClass === 'operational' ? 'text-emerald-600' : child.statusClass === 'degraded' ? 'text-yellow-600' : child.statusClass === 'partial' ? 'text-orange-600' : child.statusClass === 'outage' ? 'text-red-600' : 'text-blue-600'}">
                                    ${translatedChildStatus}
                                </span>
                            </div>
                        `;
                    });
                }
                
                html += `
                        </div>
                    </div>
                `;
            });
        }
        
        if ((!data.groups || data.groups.length === 0) && (!data.individualServices || data.individualServices.length === 0)) {
            html = `
                <div class="bg-white p-8 rounded-2xl text-center text-gray-400 shadow-sm">
                    <i class="fas fa-inbox text-3xl mb-2 opacity-30"></i>
                    <p class="text-sm">No se encontraron servicios para mostrar</p>
                </div>
            `;
        }
        
        container.innerHTML = html;
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    async function loadStatus(forceRefresh = false) {
        if (!forceRefresh) {
            const cachedData = getFromCache();
            if (cachedData) {
                renderStatus(cachedData);
                return;
            }
        }
        
        try {
            const url = forceRefresh ? `${API_URL}?refresh=true` : API_URL;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            
            const response = await fetch(url, {
                signal: controller.signal,
                headers: {
                    'Accept': 'application/json'
                }
            });
            
            clearTimeout(timeoutId);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const data = await response.json();
            
            if (data && data.success !== false) {
                saveToCache(data);
                renderStatus(data);
            } else {
                throw new Error(data.error || 'Datos inválidos del API');
            }
            
        } catch (error) {
            console.error('❌ Error cargando datos:', error);
            
            const expiredCache = localStorage.getItem(CACHE_KEY);
            if (expiredCache) {
                const cacheData = JSON.parse(expiredCache);
                renderStatus(cacheData.data);
                const lastUpdateSpan = document.getElementById('lastUpdateText');
                lastUpdateSpan.innerHTML = `<i class="fas fa-exclamation-triangle text-yellow-400 mr-1"></i>${formatDate(cacheData.data.lastUpdate)} (offline)`;
            } else {
                renderStatus({
                    success: false,
                    error: error.message,
                    generalStatus: 'Error de conexión'
                });
            }
        }
    }
    
    loadStatus();
    
    setInterval(() => {
      loadStatus();
    }, 600000);
    
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                const cacheData = JSON.parse(cached);
                const age = Date.now() - cacheData.timestamp;
                if (age >= CACHE_DURATION) {
                    loadStatus(true);
                }
            }
        }
    });
